name: build

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zip
        run: apt-get update && apt-get install -y --no-install-recommends zip
      - name: Build sysmodule + overlay and package
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: NXPlex
          path: dist/NXPlex-*.zip
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NXPlex-*.zip

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PC tools and run unit tests
        run: |
          make -C host
          make -C host test
